# ClipBox local config: TWITCH-Generator on the home PC, zero cloud tokens.
# Copy of the main config.yaml with these deviations:
#   llm.provider: ollama, whisper.backend: whispercpp-server, whisper.model large-v3-turbo,
#   vision.concurrency: 1, vision.interval_seconds: 15 (6-hour budget; see docs/spike-results.md).
# Env vars hold secrets (deploy/local/.env); this holds tunables.

download:
  format: "best"
  reuse_existing: true

# Local models via Ollama (ROCm). The Claude model names further down are ignored.
llm:
  provider: ollama
  ollama:
    base_url: http://ollama:11434
    # analyze + refine. gpt-oss:20b (13 GB MXFP4, reasoning model) judged the same 30
    # candidates far better than qwen3:14b on 2026-11-02: it kept the confirmed fights
    # and dropped small talk. It cannot stop reasoning, so think + budget below.
    text_model: gpt-oss:20b
    vision_model: qwen3-vl:8b-instruct   # triage, confirm, facecam. NOT qwen3-vl:8b: that tag is the thinking variant and ignores think:false
    think: medium                  # false for qwen3; gpt-oss needs low|medium|high ("low" returned empty selections)
    think_budget_tokens: 12000     # added to num_predict so the reasoning cannot starve the JSON answer
    num_ctx:                       # refine prompts reach ~25k tokens; needs OLLAMA_FLASH_ATTENTION + q8 KV (compose)
      text: 32768
      vision: 32768                # one 640px frame ≈ 1100 tokens on qwen3-vl → 16 frames/call ≈ 17.5k (measured 2026-11-02)
    timeout_seconds: 600

whisper:
  backend: whispercpp-server       # GPU via the whisper container (Vulkan)
  server_url: http://whisper:8080
  model: "large-v3-turbo"          # informational; the file is chosen by WHISPER_MODEL in .env
  language: de                     # null = autodetect; copied to WHISPER_LANG by bootstrap
  chunk_seconds: 1800              # 30-min chunks, one request each
  request_timeout_seconds: 3600
  # faster-whisper only (unused here):
  device: "cpu"
  compute_type: "int8"
  cpu_threads: 3
  beam_size: 1

signals:
  interval_seconds: 10
  baseline_window_seconds: 300

chat:
  enabled: true
  lag_seconds: 8
  highlight_threshold: 0.5

audio:
  enabled: true
  scale_db: 8

vision:
  enabled: true
  interval_seconds: 15       # 6-h VOD → 1440 frames → 90 triage calls of 16 frames; 10 = prod value
  frame_width: 640
  triage_model: "claude-haiku-4-5"   # ignored under ollama (vision_model is used)
  model: "claude-sonnet-4-6"         # ignored under ollama
  max_frames_per_call: 16
  concurrency: 1             # Ollama serialises per model anyway; >1 only risks timeouts
  triage_threshold: 0.4
  burst: true
  burst_width: 768
  max_windows_per_call: 4
  unconfirmed_discount: 0.6
  highlight_threshold: 0.5
  categories:
    - action
    - pvp
    - explosion
    - ship_damage
    - landing
    - bug

analyze:
  model: "claude-sonnet-4-6"       # ignored under ollama (text_model is used)
  max_clips: 10
  min_clip_seconds: 20             # 15 produced hard cuts with no setup; 20-45 leaves room for hook + payoff
  max_clip_seconds: 45
  categories:
    - funny
    - interesting
    - statement
    - exciting
  # Definitions handed to the text model with the category list (local models need them).
  category_hints:
    funny: "a real punchline or a reaction that makes strangers laugh, not just swearing"
    interesting: "the viewer learns something concrete: a game mechanic, a trick, a story, a fact"
    statement: "a sharp opinion or hot take said with conviction, quotable on its own"
    exciting: "tension that resolves: a close call, a win, a loss, a big reaction to something happening"

score:
  weights:
    chat: 0.35
    audio: 0.15
    text: 0.20                 # local text model over-scores; rank calibration below keeps only its ordering
    video: 0.30
  lead_seconds: 5
  candidate_factor: 3
  calibrate_text: rank       # percentile-rank the text scores across the VOD (0.3..1.0) instead of raw 0.8-0.9 everywhere
  agreement_bonus: 0.1       # +0.1 per additional signal >= agreement_min on the same window
  agreement_min: 0.4

refine:
  enabled: true              # set false if the local model lets too much through (documented fallback)
  model: null
  context_pad_seconds: 20
  snap_tolerance_seconds: 2.5

clip:
  auto_render: true
  vertical: true
  width: 1080
  height: 1920
  layout: split
  facecam_auto: true
  facecam:
    x: 0.0
    y: 0.0
    w: 0.22
    h: 0.22
  pad_start: 1.5               # a breath before the first word
  pad_end: 1.5                 # let the punchline land
  burn_subtitles: false

upload:
  platforms: []
  privacy: "public"
  tiktok:
    mode: draft
    privacy_level: SELF_ONLY
