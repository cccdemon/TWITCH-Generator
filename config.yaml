# TWITCH-Generator pipeline config. Env vars hold secrets; this holds tunables.

download:
  # yt-dlp format. "best" or e.g. "720p". Lower = faster transcode/clip.
  format: "best"
  # Skip re-download if VOD file already present in data dir.
  reuse_existing: true

whisper:
  # tiny|base|small|medium|large-v3 — smaller = much faster on CPU.
  # large-v3 on CPU takes hours; "small" is the sweet spot for highlight detection.
  model: "small"
  device: "cpu"          # "cuda" with a GPU image
  compute_type: "int8"   # cpu: int8 ; gpu: float16
  language: de           # null = autodetect, or "en"/"de"
  cpu_threads: 3         # cores-1 (box has 4): fast transcription, 1 core free for UI/ffmpeg. nice -19 keeps the web responsive under load.
  chunk_seconds: 1800    # transcribe in 30-min chunks → bounded RAM on long VODs
  beam_size: 1           # 1 = greedy (2-3x faster than 5); transcript is only a highlight hint

# Shared grid for the time-series signals (chat, audio). Finer = sharper peaks.
signals:
  interval_seconds: 10
  # Every signal is scored RELATIVE to a rolling median over this window, so a
  # loud stream / busy chat is not "always exciting". 300 = ±2.5 min.
  baseline_window_seconds: 300

# Chat signal — Twitch chat replay velocity (emote spam, "clip it", laughter).
# Strongest free signal: the audience already marked the moment. Needs no keys.
chat:
  enabled: true
  lag_seconds: 8             # chat reacts after the moment; shift it back by this
  highlight_threshold: 0.5   # min chat score to spawn a candidate window on its own

# Audio signal — loudness bursts above the stream's own level (ffmpeg ebur128).
audio:
  enabled: true
  scale_db: 8                # +8 dB above the local median == score 1.0

# Video signal — two-tier Claude Vision (Star Citizen is visual).
vision:
  enabled: true
  interval_seconds: 10       # grid frame every N seconds (explosions are short)
  frame_width: 640           # triage frames, downscaled to save tokens
  triage_model: "claude-haiku-4-5"   # tier 1: rough score for every grid frame
  model: "claude-sonnet-4-6"         # tier 2 + facecam detection; must be vision-capable
  max_frames_per_call: 16    # triage frames per request
  concurrency: 4             # parallel Claude requests
  triage_threshold: 0.4      # triage score that earns a tier-2 burst check
  burst: true                # tier 2: 3 frames 1.5s apart around each hot peak
  burst_width: 768
  max_windows_per_call: 4    # bursts per tier-2 request (3 images each)
  unconfirmed_discount: 0.6  # multiplier for frames tier 2 did not confirm
  highlight_threshold: 0.5   # min visual_score to spawn a candidate window
  categories:
    - action
    - pvp
    - explosion
    - ship_damage
    - landing
    - bug

analyze:
  model: "claude-sonnet-4-6"
  max_clips: 10
  # Target clip length window (seconds) for short-form vertical.
  min_clip_seconds: 15
  max_clip_seconds: 30
  # Categories the LLM scores for.
  categories:
    - funny
    - emotional
    - exciting
    - skillful

# Fusion — highlight = wC*chat + wA*audio + wT*text + wV*video (weights auto-normalized).
score:
  weights:
    chat: 0.35
    audio: 0.15
    text: 0.25
    video: 0.25
  lead_seconds: 5            # lead-in before a chat/vision spike when building a window
  candidate_factor: 3        # keep max_clips*factor candidates for the refine pass

# Refine — one global Claude pass ranks all candidates side by side, drops
# weak ones and snaps start/end onto sentence boundaries.
refine:
  enabled: true
  model: null                # null = analyze.model
  context_pad_seconds: 20    # transcript shown around each candidate
  snap_tolerance_seconds: 2.5

clip:
  # Auto-render clips in the pipeline. false = only detect highlight moments,
  # then render each clip by hand in the web editor (choose crop + trim per clip).
  auto_render: true
  # Output to 9:16 vertical for Shorts/Reels/TikTok. false = keep source aspect.
  vertical: true
  width: 1080
  height: 1920
  # Vertical composition:
  #   "split"  — top half = streamer facecam, bottom half = game content (center-crop).
  #   "crop"   — plain center-crop of the source into 9:16 (old behaviour).
  # Only used when vertical: true.
  layout: split
  # Auto-detect the facecam box with Claude Vision (one cheap call per VOD,
  # cached to data/<vod>/facecam.json). Manual picks in the web UI override it.
  # Falls back to the facecam box below when detection finds nothing.
  facecam_auto: true
  # Facecam region in the SOURCE frame, as fractions (0..1) of width/height.
  # Used as fallback when auto-detect is off or finds no cam. Tune per streamer.
  facecam:
    x: 0.0    # left edge of the cam box (fraction of source width) — TOP-LEFT corner
    y: 0.0    # top edge  (fraction of source height)
    w: 0.22   # box width  (fraction of source width)
    h: 0.22   # box height (fraction of source height)
  # Pad seconds added before/after the LLM-marked window.
  pad_start: 1.0
  pad_end: 1.0
  burn_subtitles: false

upload:
  # Download-first: clips are offered in the web UI; you upload them yourself.
  # To auto-upload instead, connect a platform in Settings and list it here
  # (youtube | tiktok | instagram).
  platforms: []
  privacy: "public"   # youtube: private|unlisted|public
